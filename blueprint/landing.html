<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>System Design for PMs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a centered column with a title and one card per diagram */
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --fg: #17202c;
  --muted: #5b6676;
  --line: #c9d1dc;
  --accent: #2563c9;
  --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c26; --fg: #e4e9f0; --muted: #94a0b1; --line: #2d3846;
    --accent: #6ea0f5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --fg: #e4e9f0; --muted: #94a0b1; --line: #2d3846;
  --accent: #6ea0f5; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.55;
  margin: 0; padding: 48px 16px 64px;
}
main { max-width: 720px; margin: 0 auto; }
h1 { font-family: var(--display); font-size: 32px; line-height: 1.15; margin: 0 0 8px; }
.lede { color: var(--muted); margin: 0 0 32px; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
a.card {
  display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 20px; color: inherit; text-decoration: none;
}
a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
.card h2 { font-family: var(--display); font-size: 18px; margin: 0 0 4px; color: var(--accent); }
.card p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>System Design for PMs</h1>
  <p class="lede">Diagrams for reading and sketching system architecture as a product manager.</p>
  <ul>
    <li>
      <a class="card" href="index.html">
        <h2>System Design Blueprint</h2>
        <p>The general diagram most designs follow: clients, API, entry, services, data, and the optional components to add as you scale.</p>
      </a>
    </li>
    <!-- Add new diagrams as another <li><a class="card" href="your-file.html">…</a></li> -->
  </ul>
</main>
</body>
</html>
